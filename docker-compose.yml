services:
  mem0:
    image: ${DOCKER_SERVER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${MEM0_PORT}:8000
    environment:
      # LLM / embedder
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      AUTH_DISABLED: ${AUTH_DISABLED}
      # Storage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_COLLECTION_NAME: ${POSTGRES_COLLECTION_NAME}
      APP_DB_NAME: ${APP_DB_NAME}
      # Misc
      DASHBOARD_URL: ${DASHBOARD_URL}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY}
      WORKERS: ${MEM0_WORKERS}
    volumes:
      - .docker/history:/app/history
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/auth/setup-status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: ${DOCKER_DASHBOARD_IMAGE}
    restart: unless-stopped
    depends_on:
      mem0:
        condition: service_started
    ports:
      - ${DASHBOARD_PORT}:3000
    environment:
      NEXT_PUBLIC_API_URL: ${DASHBOARD_API_URL}
      API_INTERNAL_URL: http://mem0:8000
      NEXT_PUBLIC_INSTANCE_NAME: ${DASHBOARD_INSTANCE_NAME}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
